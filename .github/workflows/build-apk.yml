name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      # Genera los archivos de plataforma faltantes (iconos, archivos gradle del
      # wrapper, etc.) SIN sobreescribir los ya versionados. El proyecto trae
      # android/, pubspec.yaml y lib/ a mano; esto rellena solo lo que falte.
      - name: Flutter create (rellenar plataforma Android)
        run: flutter create --platforms=android --org com.jh .

      - name: Flutter pub get
        run: flutter pub get

      # Analisis NO bloqueante: reporta problemas pero no detiene el build.
      - name: Flutter analyze (no bloqueante)
        run: flutter analyze || true

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: reportes-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
